- id: data-experience
  name: Data Experience Lab
  description: Visual Data-driven Tools and Experiences
  statement: develops new data visualizations, interactions, and experiences.
  prof: wesley-willett
  url: https://ilab.ucalgary.ca/labs/data-experience/
  colour: "#c14824"
  about: We build and study a wide range of interactive systems, all with an emphasis on enabling new data-driven experiences.
  announcements: |
    <p>We will admit a small number of new MSc and PhD students for <strong>Fall 2027</strong>. These positions will most likely have a strong emphasis on <strong>(1) situated visualization</strong>, <strong>(2) input visualization</strong>, and/or <strong>(3) inclusive visualization</strong>. Competitive students whose research interests clearly align with one of these themes should consider applying via the <a href="https://grad.ucalgary.ca/future-students">UCalgary Graduate Applications Portal</a>. (Unfortunately, given large numbers of emails from prospective students, we aren't able to respond to all emailed queries individually.)</p>
    <p>In general, students interested in working in the lab should:</p>
    <ul>
      <li>have strong technical and/or design skills (ideally both)</li>
      <li>exhibit clear intellectual curiosity and interest in generating new knowledge</li>
      <li>demonstrate care and attention to detail</li>
      <li>be self-motivated but enthusiastic about deep collaboration and critique</li>
      <li>have a strong commitment to honesty, integrity, and equity.</li>
    </ul>

